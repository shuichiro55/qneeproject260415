{% extends "index/base_qconnect_admin.html" %}

{% block content %}

<!-- <div class="authentication-bg min-vh-100 min-vw-100" style="background-color: #eaf6fd;"> -->
<div class="authentication-bg min-vh-100 min-vw-100 align-items-start" style="background-color:#edf9ff;">

  <div class="container">

    <div class ="row justify-content-center">
      <div class="col-10">
        <div class="progress mt-3 mb-5" style="height: 12px" >
          <div class="progress-bar bg-danger progress-bar-striped progress-bar-animated" role="progressbar"
            style="width: 30%"
            aria-valuenow="30" aria-valuemin="0" aria-valuemax="100">
            仮登録
          </div>

          <div class="progress-bar bg-secondary" role="progressbar"
            style="width: 30%"
            aria-valuenow="60" aria-valuemin="0" aria-valuemax="100">
            メール受領
          </div>

          <div class="progress-bar bg-secondary" role="progressbar"
            style="width: 40%"
            aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
            本登録
          </div>
        </div>
      </div>
    </div>
  
    <div class="row justify-content-center my-auto">
      <div class="col-12 col-md-8 col-lg-6 col-xl-5">

        <div class="row">
          {% for message in messages %}
          <div class="alert alert-{{ message.tags }}" role="alert" style="background-color: #fcf7fa;">
            <span>{{ message }}</span>
          </div>
          {% endfor %}
        </div>
  
        <div class="d-flex justify-content-center">
          <h3 class="text-black">仮登録</h3>
        </div>

        <div class="d-flex justify-content-center mb-4 pb-2">
          <div class="text-black-50 mb-0">あなたのメールアドレスに本登録のご案内いたします。</div>
        </div>
  
        <form method="POST">
          {{ form.non_field_errors }}

          {% for field in form %}
            {{ field }}
            {{ field.errors }}
            <hr>
          {% endfor %}

          <button type="submit" class="btn btn-primary w-100 shadow" >本登録URLを送付</button>
          <input type="hidden" name="next" value="{{ next }}" />
          {% csrf_token %}
        </form>

      </div> <!-- end col -->
    </div> <!-- end row -->
  </div> <!-- end container -->
</div>  

{% endblock %}
