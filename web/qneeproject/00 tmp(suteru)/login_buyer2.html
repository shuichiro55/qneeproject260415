{% extends "index/base_qconnect.html" %}

{% block content %}

<div class="authentication-bg min-vh-100 min-vw-100">

    <div class="container">
      <div class="d-flex flex-column min-vh-100 px-3 pt-4">
        <div class="row justify-content-center my-auto">
          <div class="col-md-8 col-lg-6 col-xl-5">
  
            <div class="d-flex justify-content-center">
              <h3 class="text-black">Welcome back to Qnee !</h3>
            </div>
            <div class="d-flex justify-content-center mb-4 pb-2">
              <div class="text-black-50 mb-0">ここからQneeをご利用いただけます</div>
            </div>
  
            <p></p>
            <h5>ログイン</h5>
            <a href="{% url 'accounts:user_create_buyer' %}">初めてのご利用の方はこちら</a>

            <form method="POST">
                {{ form.non_field_errors }}
                {% for field in form %}
                    {{ field }}
                    {{ field.errors }}
                <hr>
                {% endfor %}

                <button type="submit" class="btn btn-outline-primary" >ログインする</button>
                <!-- <input type="hidden" name="next" value="/accounts/mypage_buyer" /> -->
                {% csrf_token %}
            </form>
        </div>
{% endblock %}
