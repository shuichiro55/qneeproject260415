{% load static %}
{% load bootstrap_icons %}

{% block navbar %}

        data-bs-target="#navbarContent"
        aria-controls="navbarContent"
        aria-expanded="false"
        aria-label="Toggle navigation">
        <!-- area-expanded="false"は、関連する要素（下記のnavbar）が閉じていることを意味する？-->
        <i class="mdi mdi-menu text-secondary py-0 me-5" style="font-size:1.3em;"></i>
      </button>

      <!-- 「navbar-expand-lg」によりlg以上の場合は、初めから表示される-->
      <!-- これが表示されるとボタンは表示されない-->
      <div class="collapse navbar-collapse" id="navbarContent">

        <div class="d-none d-lg-block ms-5">

          <ul class="navbar-nav" id="navbar-navlist">
         
            <li class="nav-item">
              <a class="nav-link" href="#home">キユーニーコネクトとは</a>
            </li>

            <li class="nav-item dropdown">
              <a class="nav-link" href="#" id="navbarDropdown" role="button"
                data-bs-toggle="dropdown" aria-expanded="false">
                ログイン・ログアウト
                <i class="mdi mdi-arrow-down-circle" style="font-size:1em"></i>
              </a> 
              <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                <li><a class="nav-link" href="{% url 'accounts:login_buyer' %}">ログイン</a></li>
                <li><a class="nav-link" href="{% url 'accounts:logout_buyer' %}">ログアウト</a></li>
              </ul>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#faq">FAQ</a>
            </li>
            
            <li class="nav-item">
              <a class="nav-link" href="{% url 'accounts:contact_buyer' %}">お問い合わせ</a>
            </li>

          </ul> <!--end ul navbar-nav-->

        </div>

        <div
          class="d-block d-lg-none rounded-2 mt-2 mx-2"
          style="background-color:rgba(241, 236, 236, 0.95) !important;">

          <ul class="navbar-nav" id="navbar-navlist">
         
            <div class="row">

              <div class="col-3">
                <div class="d-flex justify-content-center">
                <li class="nav-item">
                  <a class="nav-link" href="#faq">FAQ</a>
                </li>
                </div>
              </div>

              <div class="col-3">
                <div class="d-flex justify-content-center">

                  <a class="nav-link px-0" href="{% url 'accounts:contact_buyer' %}">問い合わせ</a>
                </li>

              </div>

              <div class="col-3">
                <div class="d-flex justify-content-center">
                <li class="nav-item">
                  <a class="nav-link" href="{% url 'accounts:login_buyer' %}">ログイン</a>
                </li>
                </div>
              </div>

              <div class="col-3">
                <div class="d-flex justify-content-center">
                <li class="nav-item">
                  <a class="nav-link px-0" href="{% url 'accounts:logout_buyer' %}">ログアウト</a>
                </li>
                </div>
              </div>

            </div>
          </ul> <!--end ul navbar-nav-->
        </div>

      </div> <!--end collapse-->

    </div> <!--end container-->
  </nav> <!-- END NAVBAR -->

{% endblock %}
