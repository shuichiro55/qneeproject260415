<!DOCTYPE html>
<html>
<head>
  <title>CSVプレビュー</title>
  <!-- base_qconnect_buyer.htmlで読込済み -->
  <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"> -->
</head>
<body class="container mt-4">
  <h2>CSVプレビュー</h2>
  <form method="post" action="{% url 'send:finalize_import' %}">
    {% csrf_token %}
    <table class="table table-bordered">
      <thead>
        <tr>
          <th>名前</th>
          <th>メールアドレス</th>
        </tr>
      </thead>
      <tbody>
        {% for row in rows %}
        <tr>
          <td>{{ row.0 }}</td>
          <td>{{ row.1 }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    <button type="submit" class="btn btn-success">この内容で登録</button>
    <a href="{% url 'send:import' %}" class="btn btn-secondary">キャンセル</a>
  </form>
</body>
</html>
