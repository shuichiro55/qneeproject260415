{% load form_tags %}
<!DOCTYPE html>
<html>
<head>
  <title>CSV取込</title>
  <!-- base_qconnect_buyer.htmlで読込済み -->
  <!-- link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"> -->
</head>
<body class="container mt-4">
  <h2>CSV取込</h2>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="mb-3">
      <label for="{{ form.file.id_for_label }}" class="form-label">CSVファイルを選択してください</label>
      {{ form.file|add_class:"form-control" }}
    </div>
    <button type="submit" class="btn btn-warning">取込プレビュー</button>
    <a href="{% url 'send:servInfoMailSets_buyer' %}" class="btn btn-secondary">戻る</a>
  </form>
</body>
</html>
