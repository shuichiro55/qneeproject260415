<form class="mb-2 d-flex" hx-boost="false">
  <input type="text" name="queryWord" value="{{ queryWord }}" class="form-control me-2" placeholder="名前/メールで検索">
  <button class="btn btn-outline-secondary">検索</button>
</form>

<div class="table-responsive">
  <table class="table table-sm align-middle">
    <thead>
      <tr>
        <th>名前</th>
        <th>メール</th>
      </tr>
    </thead>
    <tbody>
    {% for r in page_obj %}
      <tr>
        <td>{{ r.userName }}</td>
        <td>{{ r.email }}</td>
      </tr>
    {% empty %}
      <tr><td colspan="2" class="text-muted">対象がありません。</td></tr>
    {% endfor %}
    </tbody>
  </table>
</div>

<nav>
  <ul class="pagination pagination-sm">
    {% if page_obj.has_previous %}
      <li class="page-item">
        <a class="page-link" href="?q={{ q }}&page={{ page_obj.previous_page_number }}">前へ</a>
      </li>
    {% endif %}
    <li class="page-item disabled">
      <span class="page-link">{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>
    </li>
    {% if page_obj.has_next %}
      <li class="page-item">
        <a class="page-link" href="?q={{ q }}&page={{ page_obj.next_page_number }}">次へ</a>
      </li>
    {% endif %}
  </ul>
</nav>
