{% extends "index/base_qconnect_buyer.html" %}

{% block content %}

<div class="authentication-bg min-vh-100 min-vw-100 align-items-start" style="background-color:#def5f9;">

  <div class="container">

    <div class ="row justify-content-center">
      <div class="col-10">
        <div class="progress mt-3 mb-5" style="height: 12px" >
          <div class="progress-bar bg-danger progress-bar-striped progress-bar-animated" role="progressbar"
            style="width: 30%"
            aria-valuenow="30" aria-valuemin="0" aria-valuemax="100">
            仮登録
          </div>

          <div class="progress-bar bg-secondary" role="progressbar"
            style="width: 30%"
            aria-valuenow="60" aria-valuemin="0" aria-valuemax="100">
            メール受領
          </div>

          <div class="progress-bar bg-secondary" role="progressbar"
            style="width: 40%"
            aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
            本登録
          </div>
        </div>
      </div>
    </div>

    <div class="row justify-content-center my-auto">
      <div class="col-11 col-md-8 col-lg-6 col-xl-5">

        <div class="row">
          {% for message in messages %}
          <div class="alert alert-{{ message.tags }}" role="alert" style="background-color: #fcf7fa;">
            <span>{{ message }}</span>
          </div>
          {% endfor %}
        </div>

        <div class="d-flex justify-content-center">
          <h3 class="text-black">ユーザーごとの権限設定</h3>
        </div>

        <form method="POST">
          
          {{ form.non_field_errors }}

          <div class="row justify-content-center my-auto">
  
            <div class="form-check form-switch justify-content-center pt-3">
              <label class="col-11 col-md-3 col-lg-2 form-check-label" for='{{form.is_approver_buyer_all.id_for_label}}' >
                すべて
              </label>
              <div class="col-md-8 col-lg-6">
                <input type='form.is_approver_buyer_all.widget.input_type' class='form-check-input'
                  name='{{form.is_approver_buyer_all.name}}'
                  value='{{form.is_approver_buyer_all.value}}'
                  id='{{form.is_approver_buyer_all.id_for_label}}' >
              </div>
            </div>

            <div class="form-check form-switch justify-content-center pt-3">
              <label class="col-11 col-md-3 col-lg-2 form-check-label" for='{{form.is_approver_buyer_add.id_for_label}}' >
                ユーザー追加
              </label>
              <div class="col-md-8 col-lg-6">
                <input type='form.is_approver_buyer_add.widget.input_type' class='form-check-input'
                  name='{{form.is_approver_buyer_add.name}}'
                  value='{{form.is_approver_buyer_add.value}}'
                  id='{{form.is_approver_buyer_add.id_for_label}}' >
              </div>
            </div>

            <div class="form-check form-switch justify-content-center pt-3">
              <label class="col-11 col-md-3 col-lg-2 form-check-label" for='{{form.is_approver_buyer_qpay.id_for_label}}' >
                Qpay承認
              </label>
              <div class="col-md-8 col-lg-6">
                <input type='form.is_approver_buyer_qpay.widget.input_type' class='form-check-input'
                  name='{{form.is_approver_buyer_qpay.name}}'
                  value='{{form.is_approver_buyer_qpay.value}}'
                  id='{{form.is_approver_buyer_qpay.id_for_label}}' >
              </div>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 shadow" name="next", value="PermitSetComplete" >設定完了</button>    
          <input type="hidden" name="next" value="{{ next }}" />

          {% csrf_token %}

        </form>

      </div>
    </div>
  </div>
</div>  

<!--          {% for field in form %}
            <div class="form-floating">
              <div class="form-group floating-label-form-group controls">
                {{ field.label_tag }}
                {{ field }}
                <p class="help-block text-danger"></p>

              </div>
            </div>
          {% endfor %}
-->         

{% endblock %}
