{% extends "partials/base_qconnect.html" %}

{% block content %}
<p></p>
<h4>仮登録</h4>

<form method="POST">
    {{ form.non_field_errors }}
    {% for field in form %}
        {{ field }}
        {{ field.errors }}
        <hr>
    {% endfor %}

    <button type="submit" class="btn btn-outline-primary" >本登録URLを送付</button>
    <input type="hidden" name="next" value="{{ next }}" />
    {% csrf_token %}
</form>

{% endblock %}
